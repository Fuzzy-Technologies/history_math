    answer:
      solution: |-
        The postponement of all the current dates of 1918 by 13 days means that the duration of this year has decreased by 13 days. Therefore, in the new chronology, the new year 1919 (and all subsequent ones) came 13 days earlier than it was “in the old way”.
    answer_text: |-
      The postponement of all the current dates of 1918 by 13 days means that the duration of this year has decreased by 13 days. Therefore, in the new chronology, the new year 1919 (and all subsequent ones) came 13 days earlier than it was “in the old way”.
    digest: |-
      January 1 according to the Julian calendar corresponds to January 14 according to the Gregorian with a difference of 13 days. Therefore, the "old New Year" in the Gregorian calendar comes later than January 1.
