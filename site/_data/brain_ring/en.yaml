    answer:
      accepted:
        - The continuum problem
        - continuum problem
        - the continuum hypothesis
        - continuum hypothesis
    answer_text: The continuum problem
    digest: |-
      In set theory, the question arose, is there not an “intermediate” set that has more elements than the set of natural numbers and less than the set of points in a straight line? This question is called the continuum problem. The continuum hypothesis was the first of twenty-three mathematical problems reported by Hilbert at the International Congress of Mathematicians in Paris in 1900. The continuum hypothesis is also known as Hilbert’s first problem. In the 1930s and 1960s, Kurt Gödel and Paul Cohen independently proved that the continuum hypothesis and its negation cannot be proved or disproved in the standard system of set theory axioms (Zermelo-Frenkel with the axiom of choice). This means that the continuum hypothesis is independent of these axioms. That is, you can build a mathematical system in which the hypothesis is true, or another in which it is false.
