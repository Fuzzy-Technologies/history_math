      The sum of his figures was subtracted from the number. From the resulting number again subtracted the sum of his (received number) digits, and so did again and again. After eleven such subtractions, for the first time, it turned out to be zero. On what date did the calculations begin?
    answer:
      solution: |-
        Any number from 100 to 109 is suitable. Solution. The difference between the number and the sum of its numbers is divided by 9. So all the numbers we got were divisible by 9 (except maybe the original). Let's go from the end. In principle, zero is obtained from any single natural number after subtracting the sum of the digits from it. Of these, only 9 are divided into 9. So in the penultimate step, we had the number 9. But 9 can be obtained only from one number divisible by 9, from 18. And so on until we get to the number 81. Here the path is bifurcated - 81 can be obtained from both 90 and 99. Let's take the last step back (now divisibility by 9 is no longer important to us!) - 90 of any number can not be obtained, and for 99 there are as many as 10 possible predecessors: 100, 101, 102, ..., 109. Example of a computing chain: 0 < 9 < 18 < 27 < 36 < 45 < 54 < 63 < 72 < 81 < 99 < 100
    answer_text: |-
      Any number from 100 to 109 is suitable. Solution. The difference between the number and the sum of its numbers is divided by 9. So all the numbers we got were divisible by 9 (except maybe the original). Let's go from the end. In principle, zero is obtained from any single natural number after subtracting the sum of the digits from it. Of these, only 9 are divided into 9. So in the penultimate step, we had the number 9. But 9 can be obtained only from one number divisible by 9, from 18. And so on until we get to the number 81. Here the path is bifurcated - 81 can be obtained from both 90 and 99. Let's take the last step back (now divisibility by 9 is no longer important to us!) - 90 of any number can not be obtained, and for 99 there are as many as 10 possible predecessors: 100, 101, 102, ..., 109. Example of a computing chain: 0 < 9 < 18 < 27 < 36 < 45 < 54 < 63 < 72 < 81 < 99 < 100
    digest: |-
