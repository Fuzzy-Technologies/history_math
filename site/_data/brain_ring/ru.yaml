    answer_text: Профессор — это женщина. Сын отца — это её брат. Отец сына — это муж профессора
    digest: |-
      При предполагаемом в загадке родстве профессор — женщина. Её брат и отец её сына разговаривают друг с другом, поэтому она сама в разговоре не участвует.
