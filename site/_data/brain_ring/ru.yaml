    prompt: «Давайте бороться за то, чтобы успеваемость каждого ученика была выше средней!» Выполним ли этот лозунг?
    answer:
      solution: |-
        Нет. Среднее арифметическое лежит между минимумом и максимумом значений. Поэтому если значения не все равны, то обязательно найдётся хотя бы одно ниже среднего. А если вдруг все одинаковы, то каждый равен среднему, но не выше него. Поэтому лозунг невыполним по определению среднего.
    answer_text: |-
      Нет. Среднее арифметическое лежит между минимумом и максимумом значений. Поэтому если значения не все равны, то обязательно найдётся хотя бы одно ниже среднего. А если вдруг все одинаковы, то каждый равен среднему, но не выше него. Поэтому лозунг невыполним по определению среднего.
    digest: |-
      Среднее всегда находится между минимумом и максимумом. Поэтому ученик с минимальным результатом не может иметь результат строго выше среднего.
