      solution: |-
        Перенос всех текущих дат 1918 года на 13 дней вперёд означает, что продолжительность этого года уменьшилась на 13 дней. Следовательно, в новом летосчислении новый, 1919 год (и все последующие), наступил на 13 дней раньше, чем это было «по-старому»
