    answer:
      solution: |-
        Да. Пусть: Б — общее количество блондинов, Г — общее количество голубоглазых, БГ — количество голубоглазых блондинов, Н — общее количество людей. По условию, доля блондинов среди голубоглазых (БГ/Г) больше, чем доля блондинов среди всего населения (Б/Н). Чтобы ответить на вопрос, нужно сравнить долю голубоглазых среди блондинов (БГ/Б) с долей голубоглазых среди всего населения (Г/Н). (БГ/Г) > (Б/Н). Умножим обе части на (Г/Б). (БГ/Г)(Г/Б) > (Б/Н)(Г/Б). Значит, (БГ/Б) > (Г/Н)
    answer_text: |-
