    prompt: Можно ли обычный лист бумаги сложить пополам десять раз? Во сколько раз при этом увеличится толщина бумаги?
    answer:
      solution: |-
        Нет, толщина увеличивается в геометрической прогрессии. После первого складывания пополам толщина бумаги увеличится вдвое, после второго — вчетверо, и очень скоро практические возможности будут исчерпаны. После десятого — это два в десятой степени раз: 2¹⁰ = 1024. Попробуйте согнуть столько раз. Считается, что обычный лист бумаги, даже с максимальными усилиями, невозможно сложить пополам более 7–8 раз
