  - id: br-2026-03-07-q03-ru
    source_id: br-2026-03-07-q03
    source_ids:
      - br-2026-03-07-q03
    edition_source_id: br-2026-03-07-q03
    topic: arithmetic
    difficulty: intermediate
    format: short_input
    prompt: |-
      Из числа вычли сумму его цифр. Из полученного числа вновь вычли сумму его (полученного числа) цифр, и так делали снова и снова. После одиннадцати таких вычитаний впервые получился нуль. С какого числа начали вычисления?
    answer:
      accepted:
        - Подходит любое число от 100 до 109
    answer_text: Подходит любое число от 100 до 109
    digest: |-
      Решение. Разность между числом и суммой его цифр делится на 9. Поэтому все числа, которые мы получали, делились на 9 (кроме, может быть, исходного). Пойдём с конца. Нуль в принципе получается из любого однозначного натурального числа после вычитания из него суммы цифр. Но из них на 9 делится только 9. Поэтому на предпоследнем шаге у нас было число 9. Но 9 можно получить только из одного числа, делящегося на 9, — из 18. И так далее пока не дойдём до числа 81. Тут путь раздваивается — 81 можно получить и из 90, и из 99. Сделаем последний шаг назад (теперь делимость на 9 нам уже не важна!) — 90 ни из какого числа получить нельзя, а для 99 есть целых 10 возможных предшественников: 100, 101, 102, …, 109. Пример цепочки вычислений: 0 < 9 < 18 < 27 < 36 < 45 < 54 < 63 < 72 < 81 < 99 < 100
    links: []
