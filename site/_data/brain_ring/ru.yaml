      Может ли быть четыре рыбака? Если так, то сумма последних цифр 2 + 3 + 3 + 4 = 12 оканчивается на 2. Но не существует квадрата натурального числа, который оканчивается на 2. Значит, речь идёт не о четырёх, а лишь о трёх рыбаках, то есть сын одного из любителей рыбной ловли одновременно является отцом другого. Николай не может быть сыном Петра, так как улов Николая оканчивается на 2, а не на 4, как того требует условие задачи. Эта задача имеет даже собственное название — «Задача из Болгарии», о ней мы писали в одном из постов ранее https://t.me/history_math/804
