    answer:
      solution: |-
        На оптико-геометрических свойствах эллипса, или эллипсоида вращения. Оптическое свойство эллипса: если поместить точечный источник излучения («лампочку») в один из фокусов эллипса и включить его, то лучи, отразившись от эллипса, соберутся во втором фокусе. При этом все лучи придут во второй фокус одновременно, так как для каждого луча длина пройденного пути будет одна и та же, по определению эллипса
    answer_text: |-
