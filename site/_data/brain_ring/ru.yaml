    prompt: В 3 часа 15 минут минутная и часовая стрелки почти совпадают, но не совсем. Какой угол между ними?
    answer:
      accepted:
        - 7,5°
    answer_text: 7,5°
    digest: |-
      Минутная стрелка на 90°, часовая на 97,5°. Часовая стрелка проходит 360° за 12 часов или за 720 минут. Скорость её движения составляет 360 / 720 = 0.5° в минуту. Время, прошедшее с полудня в минутах, равно 3 × 60 + 15 = 195 минут. Значит, положение часовой стрелки относительно отметки «12» составляет 195 × 0.5 = 97,5°. Таким образом, разность между стрелками — 7,5°.
