    format: matching
    prompt: |-
      Окрашенный куб с ребром в 10 см распилили на кубики с ребром в 1 см. Сколько среди них окажется кубиков с одной окрашенной гранью? И сколько с двумя?
    answer:
      left:
        - id: one
          text: Одна окрашенная грань
        - id: two
          text: Две окрашенные грани
      right:
        - id: n96
          text: '96'
        - id: n384
          text: '384'
      pairs:
        one: n384
        two: n96
    answer_text: 384 и 96
    digest: |-
      На каждой из шести граней 8 × 8 кубиков лежат вдали от рёбер, всего 384. На каждом из двенадцати рёбер есть 8 кубиков без учёта вершин, всего 96.
    links: []
