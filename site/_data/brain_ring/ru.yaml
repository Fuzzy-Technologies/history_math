    prompt: |-
      Однажды к академику Н. Н. Лузину привели пятнадцатилетнего мальчика Льва Шнирельмана, обладавшего исключительными математическими способностями. Впоследствии он стал одним из виднейших советских математиков, членом-корреспондентом АН СССР. Чтобы проверить способности юного математика, Лузин предложил ему тридцать труднейших задач. Решения 29 задач он знал. Но, увы, через неделю молодой математик пришёл к академику и грустно сказал: «Одна задача почему-то не выходит». Знаете ли вы, какую 30-ю задачу не смог решить Шнирельман?
    answer:
      accepted:
        - Проблема континуума
        - континуум-гипотеза
        - гипотеза континуума
    answer_text: Проблема континуума
    digest: |-
      В теории множеств возник вопрос, а нет ли «промежуточного» множества, которое имело бы больше элементов, чем множество натуральных чисел, и меньше, чем множество точек на прямой? Этот вопрос получил название «проблемы континуума». Континуум-гипотеза стала первой из двадцати трёх математических проблем, о которых Гильберт доложил на Международном конгрессе математиков в Париже в 1900 году. Поэтому континуум-гипотеза известна также как первая проблема Гильберта. В 1930-х и 1960-х годах Курт Гёдель и Пол Коэн независимо доказали, что континуум-гипотеза и её отрицание не могут быть доказаны или опровергнуты в стандартной системе аксиом теории множеств (Цермело — Френкеля с аксиомой выбора). Это означает, что континуум-гипотеза является независимой от этих аксиом. То есть, можно построить математическую систему, в которой гипотеза верна, а можно другую, в которой она ложна.
    links: []
