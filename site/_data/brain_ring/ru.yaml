    format: short_input
    prompt: |-
      Ребята одного класса были в походе и в экскурсии. В походе участвовало 89%, в экскурсии — 78%. Все приняли участие в походе или экскурсии. Сколько ребят (в%) были и в походе, и в экскурсии?
    answer:
      accepted:
        - 67%
    answer_text: 67%
    digest: |-
      Поскольку все учащиеся были или в походе, или на экскурсии, то процент учащихся бывших только на экскурсии равен проценту тех, кто не ходил в поход, то есть 100% – 89% = 11% и процент учащихся, бывших только в походе равен проценту тех, кто не ходил на экскурсию, то есть 100% – 78% = 22%. Те, кто был и в походе, и на экскурсии, не входят в процент тех, кто был только на экскурсии или только в походе: 100% – 11% – 22% = 67%. Алгебраическое решение: обозначим через a, b, c процент учащихся, бывших только в походе, бывших только на экскурсии, бывших и в походе, и на экскурсии соответственно. Тогда a + b + c = 100, a + c = 89, b + c = 78. ((a + c) + (b + c) – (a + b + c) = 89 + 78 – 100 = c = 67.
    links: []
