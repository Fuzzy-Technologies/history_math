    topic: logic
    difficulty: intermediate
    format: single_choice
    prompt: |-
      Я отпил 1/6 часть стакана черного кофе и долил его молоком. Затем я выпил 1/3 стакана и снова долил его молоком. Потом я выпил полстакана и опять долил молоком. Наконец я выпил полный стакан. Чего больше выпито: кофе или молоко?
    answer:
      options:
        - id: coffee
          text: Кофе
        - id: milk
          text: Молоко
        - id: equal
          text: Поровну
      correct: equal
    answer_text: 'Одинаково: кофе и молока выпито по стакану'
    digest: |-
      К началу опыта в стакане был один стакан кофе. Молока долили 1/6 + 1/3 + 1/2 = 1 стакан. В конце стакан пуст, поэтому выпито по стакану каждого напитка.
    links: []
