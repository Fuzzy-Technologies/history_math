{% assign figure = page.figures | where: 'id', include.id | first %}
{% assign credit = figure | figure_credit %}
{%- assign caption_license = figure | figure_caption_license %}
<figure id="{{ figure.id }}">
  {% include reading-image.html src=figure.path alt=figure.alt %}
  {% if figure.caption != '' or credit != '' or figure.source_url or caption_license %}<figcaption>{{ figure.caption | escape }}{% if credit != '' %}{% if figure.caption != '' %} · {% endif %}<span class="figure-source">{{ credit | escape }}</span>{% endif %}{% if figure.source_url %} · <a href="{{ figure.source_url | external_url: page.lang | escape }}">{% if page.lang == 'ru' %}Источник{% else %}Source{% endif %}</a>{% endif %}{% if caption_license %} · {% if figure.license_url %}<a href="{{ figure.license_url | external_url: page.lang | escape }}">{{ caption_license | escape }}</a>{% else %}{{ caption_license | escape }}{% endif %}{% endif %}</figcaption>{% endif %}
</figure>
