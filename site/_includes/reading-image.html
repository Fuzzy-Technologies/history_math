{%- assign asset = include.src | image_asset -%}
{%- if asset -%}
  {%- assign preview = asset.variants | last -%}
  <img src="{{ preview.path | relative_url }}"{% unless asset.logo %} srcset="{% for variant in asset.variants %}{{ variant.path | relative_url }} {{ variant.width }}w{% unless forloop.last %}, {% endunless %}{% endfor %}" sizes="{{ include.sizes | default: '(max-width: 800px) 92vw, 960px' }}"{% endunless %} data-original="{{ include.src | relative_url }}" alt="{{ include.alt | default: '' | escape }}" width="{{ include.width | default: asset.width }}" height="{{ include.height | default: asset.height }}" loading="{{ include.loading | default: 'lazy' }}" decoding="async"{% if include.priority %} fetchpriority="{{ include.priority }}"{% endif %}>
{%- else -%}
  <img src="{{ include.src | relative_url }}" alt="{{ include.alt | default: '' | escape }}"{% if include.width %} width="{{ include.width }}"{% endif %}{% if include.height %} height="{{ include.height }}"{% endif %} loading="{{ include.loading | default: 'lazy' }}" decoding="async"{% if include.priority %} fetchpriority="{{ include.priority }}"{% endif %}>
{%- endif -%}
