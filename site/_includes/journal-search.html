{% assign ui = site.data.interface[page.lang] %}{% assign materials = '/materials/' %}{% if page.lang == 'ru' %}{% assign materials = '/ru/materials/' %}{% endif %}
<section class="page-heading"><p class="eyebrow">{{ ui.search_overline }}</p><h1>{{ page.title }}</h1><p class="lead">{{ page.description }}</p></section>
<section class="search-panel"><form id="search-form" role="search"><label for="query">{{ ui.query_label }}</label><div class="search-row"><input id="query" type="search" placeholder="{{ ui.query_placeholder }}" autocomplete="off"><button class="button" type="submit">{{ ui.find }} →</button></div></form><div id="search-topic" class="search-topic" hidden><span>{{ ui.topic }}: <strong></strong></span><button type="button">{{ ui.clear_filter }} <span aria-hidden="true">×</span></button></div><p id="search-status" role="status">{{ ui.search_prompt }}</p><div id="search-results" class="search-results"></div><noscript>{{ ui.noscript }} <a href="{{ materials | relative_url }}">{{ ui.reading }}</a></noscript></section>
