name: Prepare article files

on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'Number of the open article PR to prepare'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: article-preparation-${{ github.ref }}-${{ inputs.pr }}
  cancel-in-progress: false

jobs:
  plan:
    if: >-
      github.repository == 'Fuzzy-Technologies/history_math' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Never check out the PR head in a job with write permissions.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Authorize the requested PR and pin its head
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/article_batch.py --repository "$GITHUB_REPOSITORY"
          --base-sha "$GITHUB_SHA" --event-file "$GITHUB_EVENT_PATH"
          --output test-results/article-preparation-plan.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: article-preparation-plan
          path: test-results/article-preparation-plan.json
          retention-days: 30
          if-no-files-found: error

  prepare:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install trusted preparation dependencies
        run: |
          npm ci
          python3 -m pip install -r tools/requirements-images.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: article-preparation-plan
          path: test-results
      - name: Verify originals, store assets and prepare clean article commits
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/article_batch.py --repository "$GITHUB_REPOSITORY"
          --plan test-results/article-preparation-plan.json
          --base-sha "$GITHUB_SHA" --event-file "$GITHUB_EVENT_PATH"
          --workspace "$RUNNER_TEMP/article-preparation"
          --output test-results/article-preparation-receipts.json
      - name: Save verified preparation receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: article-preparation-receipts-0
          path: test-results/article-preparation-receipts.json
          retention-days: 30
          if-no-files-found: warn
