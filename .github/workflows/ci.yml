name: Prototype checks

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, 'feature/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prototype-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned browser checks
        run: npm ci && npx playwright install --with-deps chromium
      - name: Validate source contracts, privacy boundary and workflow guards
        run: |
          npm test
          bundle exec ruby tests/publication_test.rb
      - name: Build and inspect project-path output
        run: |
          bundle exec jekyll build --trace
          python3 scripts/check_site.py _site /history_math
      - name: Browser checks and screenshots
        run: npm run test:browser
      - name: Verify root-domain portability
        run: |
          bundle exec jekyll build --baseurl '' --destination _site-domain --trace
          python3 scripts/check_site.py _site-domain ''
          rm -rf _site-domain
      - name: Save inspectable prototype
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prototype-${{ github.sha }}
          path: _site
          if-no-files-found: error
          retention-days: 14
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-evidence-${{ github.sha }}
          path: test-results
          if-no-files-found: warn
          retention-days: 14
