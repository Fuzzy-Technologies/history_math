name: Prototype checks

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, 'feature/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prototype-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4 # v1.207.0
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned browser checks
        run: npm ci && npx playwright install --with-deps chromium
      - name: Validate source contracts, privacy boundary and workflow guards
        run: |
          npm test
          bundle exec ruby tests/publication_test.rb
      - name: Build and inspect project-path output
        run: |
          bundle exec jekyll build --trace
          python3 scripts/check_site.py _site /history_math
      - name: Browser checks and screenshots
        run: npm run test:browser
      - name: Verify root-domain portability
        run: |
          bundle exec jekyll build --baseurl '' --destination _site-domain --trace
          python3 scripts/check_site.py _site-domain ''
          rm -rf _site-domain
      - name: Save inspectable prototype
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prototype-${{ github.sha }}
          path: _site
          if-no-files-found: error
          retention-days: 14
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-evidence-${{ github.sha }}
          path: test-results
          if-no-files-found: warn
          retention-days: 14
