name: Prototype checks

on:
  pull_request:
  push:
    branches: [master, 'feature/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prototype-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  articles:
    name: Article package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Markdown tables
        run: |
          python3 -m unittest discover -s tests -p markdown_tables_test.py
          python3 tools/markdown_tables.py
      - name: Install pinned checks
        run: npm ci
      - name: Contract and report regression tests
        run: node --test tests/articles.test.mjs tests/article-review.test.mjs
      - name: Source contracts and article report
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/check-articles.mjs --source-only
      - name: Save compact article reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: article-report-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/article-report.json
            test-results/article-report.md
          if-no-files-found: error
          retention-days: 14
          overwrite: true
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned source checks
        run: |
          npm ci
          python3 -m pip install -r tools/requirements-images.txt
      - name: Validate source contracts, privacy boundary and workflow guards
        run: |
          python3 tools/markdown_tables.py
          npm test
          bundle exec ruby tests/teletype_dates_test.rb
          bundle exec ruby tests/image_originals_test.rb
          bundle exec ruby tests/external_originals_test.rb
