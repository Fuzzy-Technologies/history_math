name: Update article review comment

on:
  workflow_run:
    workflows: ['Prototype checks']
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  comment:
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'feature/') &&
      github.event.workflow_run.conclusion != 'action_required'
    concurrency:
      group: article-comment-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Read only trusted CI metadata and the default branch's message dictionary.
      - uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            const repo = context.repo;
            const repository = `${repo.owner}/${repo.repo}`;
            if (context.eventName !== 'workflow_run' || run?.status !== 'completed' ||
                run.name !== 'Prototype checks' || run.path !== '.github/workflows/ci.yml' ||
                !['push', 'pull_request', 'workflow_dispatch'].includes(run.event) ||
                run.conclusion === 'action_required' || !/^[a-f0-9]{40}$/.test(run.head_sha ?? '') ||
                run.repository?.full_name !== repository || run.head_repository?.full_name !== repository ||
                typeof run.head_branch !== 'string' || !run.head_branch.startsWith('feature/')) return;

            const matches = pr => pr.state === 'open' && pr.base?.ref === 'master' &&
              pr.base.repo?.full_name === repository && pr.head?.repo?.full_name === repository &&
              pr.head.ref === run.head_branch && pr.head.sha === run.head_sha;
            const requests = await github.paginate(github.rest.pulls.list, {...repo,
              state: 'open', base: 'master', head: `${repo.owner}:${run.head_branch}`, per_page: 100});
            const candidates = requests.filter(matches);
            if (!candidates.length) return;

            const attempt = run.run_attempt;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
              ...repo, run_id: run.id, attempt_number: attempt, per_page: 100});
            const check = jobs.find(job => job.name === 'Article package');
            let result = 'incomplete';
            if (check?.conclusion === 'success' && run.conclusion === 'success') result = 'source_pass';
            if (check?.conclusion === 'failure' || run.conclusion === 'failure') result = 'fail';

            const {data} = await github.rest.repos.getContent({...repo, path: 'schemas/messages.json', ref: context.sha});
            if (data.size > 24000 || data.encoding !== 'base64') throw new Error('Invalid message dictionary');
            const dictionary = JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'));
            const m = dictionary[run.head_branch.endsWith('-ru') ? 'ru' : 'en'];
            const marker = '<!-- history-math-article-report-v1 -->';
            const body = `${marker}\n<!-- run:${run.id} attempt:${attempt} -->\n${m[result]}\n\n${m.source_profile}\n\n${m.commit}: \`${run.head_sha}\`\n\n${m.preview}: [${m.preview}](${run.html_url})\n`;

            for (const {number} of candidates) {
              const comments = await github.paginate(github.rest.issues.listComments, {...repo, issue_number: number, per_page: 100});
              const previous = comments.find(c => c.user?.login === 'github-actions[bot]' && c.body?.startsWith(marker));
              const version = /<!-- run:(\d+) attempt:(\d+) -->/.exec(previous?.body ?? '');
              if (previous?.body === body || (version && (Number(version[1]) > run.id ||
                  (Number(version[1]) === run.id && Number(version[2]) > attempt)))) continue;
              const live = (await github.rest.pulls.get({...repo, pull_number: number})).data;
              if (!matches(live)) continue;
              if (previous) await github.rest.issues.updateComment({...repo, comment_id: previous.id, body});
              else await github.rest.issues.createComment({...repo, issue_number: number, body});
            }
