name: Delete merged feature branch

on:
  pull_request_target:
    types: [closed]
    branches: [develop]

permissions:
  contents: read

jobs:
  cleanup:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'feature/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      # No checkout, no head-branch scripts, and no interpolation of PR text.
      - name: Delete only an unchanged, merged feature branch
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const repo = context.repo;
            if (!pr?.merged || pr.base.ref !== 'develop' ||
                pr.head.repo?.full_name !== `${repo.owner}/${repo.repo}` ||
                !pr.head.ref.startsWith('feature/') ||
                ['master', 'develop'].includes(pr.head.ref)) {
              core.info('Not eligible for branch cleanup.');
              return;
            }
            const ref = `heads/${pr.head.ref}`;
            let current;
            try {
              current = await github.rest.git.getRef({...repo, ref});
            } catch (error) {
              if (error.status === 404) {
                core.info('Branch already deleted.');
                return;
              }
              throw error;
            }
            if (current.data.object.sha !== pr.head.sha) {
              core.warning('Branch has newer commits; keeping it.');
              return;
            }
            const open = await github.paginate(github.rest.pulls.list, {
              ...repo, state: 'open', head: `${repo.owner}:${pr.head.ref}`, per_page: 100
            });
            if (open.length) {
              core.warning('Another open PR uses this branch; keeping it.');
              return;
            }
            const latest = await github.rest.git.getRef({...repo, ref});
            if (latest.data.object.sha !== pr.head.sha) {
              core.warning('Branch changed during cleanup; keeping it.');
              return;
            }
            try {
              await github.rest.git.deleteRef({...repo, ref});
            } catch (error) {
              if (error.status !== 404) throw error;
              core.info('Branch was already deleted.');
              return;
            }
            core.info(`Deleted ${pr.head.ref} after merge into develop.`);

