name: Audit and maintain current media storage

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      clean_github:
        description: Remove verified GitHub duplicates after the audit
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: media-storage-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref == 'refs/heads/master' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: history-math-storage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/site/assets/images/
            !/site/assets/fonts/
            !/site/assets/vendor/katex/fonts/
            !/docs/previews/
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Inventory current references and obsolete media without deleting
        env:
          GITHUB_TOKEN: ${{ github.token }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ vars.S3_ENDPOINT_URL }}
          S3_REGION: ${{ vars.S3_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_PUBLIC_BASE_URL: ${{ vars.S3_PUBLIC_BASE_URL }}
        run: node scripts/media-cleanup.mjs --dry-run
      - name: Retain storage audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: media-audit-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/media-cleanup/
          if-no-files-found: warn
          retention-days: 7
  github_cleanup:
    if: github.ref == 'refs/heads/master' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.clean_github))
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: read
      actions: write
    concurrency:
      group: github-storage-maintenance
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/site/assets/images/
            !/site/assets/fonts/
            !/site/assets/vendor/katex/fonts/
            !/docs/previews/
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Remove verified GitHub copies and superseded build storage
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_STORAGE_AFTER_AUDIT: 'true'
        run: node scripts/github-storage-cleanup.mjs --apply
      - name: Retain exact GitHub deletion journal
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-storage-cleanup-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/media-cleanup/
          if-no-files-found: warn
          retention-days: 7
