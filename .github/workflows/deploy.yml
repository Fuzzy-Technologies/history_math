name: Publish approved master

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      pages: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: history-math-storage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages
      - name: Restore incremental PDF cache
        id: pdf-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .pdf-cache
          key: pdf-v1-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          restore-keys: pdf-v1-${{ runner.os }}-
      - name: Install publication dependencies
        run: npm ci
      - name: Choose checks since the last successful publication
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLICATION_FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/publication-plan.mjs
      - name: Validate article sources and reading assets
        run: |
          python3 tools/markdown_tables.py
          python3 tools/image_assets.py
          python3 tools/pdf_mastheads.py
          node scripts/check-articles.mjs --source-only
      - name: Preflight existing S3 media copies
        env:
          PAGES_ORIGIN: https://${{ steps.pages.outputs.host }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ vars.S3_ENDPOINT_URL }}
          S3_REGION: ${{ vars.S3_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_PUBLIC_BASE_URL: ${{ vars.S3_PUBLIC_BASE_URL }}
        run: node scripts/backfill-media.mjs --preflight
      - name: Install PDF rendering engine
        run: |
          npx playwright install --with-deps chromium
          if [ "${{ steps.plan.outputs.full_checks }}" = "true" ] && ! command -v pdftoppm >/dev/null; then
            sudo apt-get install -y poppler-utils
          fi
      - name: Check native S3 attachment downloads
        if: steps.plan.outputs.full_checks == 'true'
        env:
          PAGES_ORIGIN: https://${{ steps.pages.outputs.host }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: node tests/s3-download-browser.mjs
      - name: Verify site code, layout and browser contracts
        if: steps.plan.outputs.full_checks == 'true'
        run: |
          python3 -m pip install -r tools/requirements-images.txt
          npm test
          for test_file in tests/*_test.rb; do
            bundle exec ruby "$test_file"
          done
          node scripts/article-pdf.mjs --site-dir test-results/pdf-fixture
          node tests/pdf-cache-browser.mjs
          HISTORY_MATH_PUBLICATION_REF="$GITHUB_SHA" HISTORY_MATH_PUBLICATION_STRICT=1 bundle exec jekyll build --trace
          node scripts/article-pdf.mjs
          python3 scripts/check_pdf_colors.py _site
          python3 scripts/check_site.py _site /history_math
          npm run test:browser
          node tests/article-details-browser.mjs
          node tests/article-urls-browser.mjs
      - name: Build and verify configured Pages site
        env:
          JEKYLL_ENV: production
          # Pages can report HTTP while the custom-domain certificate is being issued.
          PAGES_ORIGIN: https://${{ steps.pages.outputs.host }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          FULL_CHECKS: ${{ steps.plan.outputs.full_checks }}
        run: |
          node scripts/pages-config.mjs > "$RUNNER_TEMP/history-math-pages.yml"
          HISTORY_MATH_PUBLICATION_REF="$GITHUB_SHA" HISTORY_MATH_PUBLICATION_STRICT=1 bundle exec jekyll build --config "_config.yml,$RUNNER_TEMP/history-math-pages.yml" --destination _site-pages --trace
          node scripts/article-pdf.mjs --site-dir _site-pages
          python3 scripts/check_site.py _site-pages "$PAGES_BASE_PATH" "$PAGES_ORIGIN"
          if [ "$FULL_CHECKS" = "true" ]; then
            IMAGE_SITE_DIR=_site-pages IMAGE_BASEURL="$PAGES_BASE_PATH" node tests/image-delivery-browser.mjs
            ERROR_SITE_DIR=_site-pages ERROR_BASEURL="$PAGES_BASE_PATH" node tests/errors-browser.mjs
            URL_SITE_DIR=_site-pages URL_BASEURL="$PAGES_BASE_PATH" URL_ORIGIN="$PAGES_ORIGIN" node tests/article-urls-browser.mjs
            python3 scripts/check_pdf_colors.py _site-pages
          fi
      - name: Save validated PDF cache
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .pdf-cache
          key: ${{ steps.pdf-cache.outputs.cache-primary-key }}
      - name: Prepare bounded full-resolution JPEG originals
        run: |
          python3 -m pip install -r tools/requirements-images.txt
          python3 scripts/publication_jpegs.py --registry site/_data/image_publication.json --output test-results/publication-jpegs/plan.json
      - name: Publish verified S3 media
        env:
          PAGES_ORIGIN: https://${{ steps.pages.outputs.host }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ vars.S3_ENDPOINT_URL }}
          S3_REGION: ${{ vars.S3_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_PUBLIC_BASE_URL: ${{ vars.S3_PUBLIC_BASE_URL }}
        run: |
          node scripts/publication-media.mjs --site-dir _site-pages --publish --prune-output
          node scripts/bucket-media-budget.mjs
      - name: Verify final lightweight publication
        env:
          PAGES_ORIGIN: https://${{ steps.pages.outputs.host }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          FULL_CHECKS: ${{ steps.plan.outputs.full_checks }}
        run: |
          python3 scripts/check_site.py _site-pages "$PAGES_BASE_PATH" "$PAGES_ORIGIN"
          node scripts/publication-size.mjs _site-pages
          if [ "$FULL_CHECKS" = "true" ]; then
            VIEWER_SITE_DIR=_site-pages node tests/image-viewer-browser.mjs
            MEDIA_SITE_DIR=_site-pages MEDIA_BASEURL="$PAGES_BASE_PATH" node tests/publication-media-browser.mjs
          fi
      - name: Retain media integrity receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publication-media-${{ github.sha }}-${{ github.run_id }}
          path: |
            test-results/media-backfill/receipt.json
            _site-pages/assets/publication-media.json
            test-results/bucket-budget/receipt.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site-pages
  deploy:
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved master
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
  retire_oversized_media:
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: history-math-storage
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /site/_data/image_publication.json
            /package.json
            /package-lock.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Retire verified oversized versions after live deployment
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ vars.S3_ENDPOINT_URL }}
          S3_REGION: ${{ vars.S3_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_PUBLIC_BASE_URL: ${{ vars.S3_PUBLIC_BASE_URL }}
        run: node scripts/bucket-media-budget.mjs --retire
      - name: Retain complete bucket size and retirement evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bucket-budget-${{ github.sha }}-${{ github.run_id }}
          path: test-results/bucket-budget/
          if-no-files-found: warn
          retention-days: 90
