name: Publish approved master

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      pages: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages
      - name: Restore incremental PDF cache
        id: pdf-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .pdf-cache
          key: pdf-v1-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          restore-keys: pdf-v1-${{ runner.os }}-
      - name: Install publication dependencies
        run: npm ci
      - name: Choose checks since the last successful publication
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLICATION_FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/publication-plan.mjs
      - name: Validate article sources and reading assets
        run: |
          python3 tools/markdown_tables.py
          python3 tools/image_assets.py
          python3 tools/pdf_mastheads.py
          node scripts/check-articles.mjs --source-only
      - name: Install PDF rendering engine
        run: |
          npx playwright install --with-deps chromium
          if [ "${{ steps.plan.outputs.full_checks }}" = "true" ] && ! command -v pdftoppm >/dev/null; then
            sudo apt-get install -y poppler-utils
          fi
      - name: Verify site code, layout and browser contracts
        if: steps.plan.outputs.full_checks == 'true'
        run: |
          python3 -m pip install -r tools/requirements-images.txt
          npm test
          for test_file in tests/*_test.rb; do
            bundle exec ruby "$test_file"
          done
          node scripts/article-pdf.mjs --site-dir test-results/pdf-fixture
          node tests/pdf-cache-browser.mjs
          HISTORY_MATH_PUBLICATION_REF="$GITHUB_SHA" HISTORY_MATH_PUBLICATION_STRICT=1 bundle exec jekyll build --trace
          node scripts/article-pdf.mjs
          python3 scripts/check_pdf_colors.py _site
          python3 scripts/check_site.py _site /history_math
          npm run test:browser
          node tests/article-details-browser.mjs
          node tests/article-urls-browser.mjs
      - name: Build and verify configured Pages site
        env:
          JEKYLL_ENV: production
          # Pages can report HTTP while the custom-domain certificate is being issued.
          PAGES_ORIGIN: https://${{ steps.pages.outputs.host }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          FULL_CHECKS: ${{ steps.plan.outputs.full_checks }}
          PDF_RELEASE_STORAGE: ${{ vars.ARTICLE_PDF_RELEASE_STORAGE }}
        run: |
          node scripts/pages-config.mjs > "$RUNNER_TEMP/history-math-pages.yml"
          HISTORY_MATH_PUBLICATION_REF="$GITHUB_SHA" HISTORY_MATH_PUBLICATION_STRICT=1 bundle exec jekyll build --config "_config.yml,$RUNNER_TEMP/history-math-pages.yml" --destination _site-pages --trace
          node scripts/article-pdf.mjs --site-dir _site-pages
          python3 scripts/check_site.py _site-pages "$PAGES_BASE_PATH" "$PAGES_ORIGIN"
          if [ "$PDF_RELEASE_STORAGE" = "true" ]; then
            python3 scripts/external_pdfs.py fetch --compatibility-dir test-results/pdf-compatibility-cache --report test-results/pdf-compatibility-fetch.json
            python3 scripts/external_pdfs.py plan --site-dir _site-pages --compatibility-dir test-results/pdf-compatibility-cache --report test-results/pdf-storage-plan.json
          else
            node scripts/publication-size.mjs _site-pages
          fi
          if [ "$FULL_CHECKS" = "true" ]; then
            IMAGE_SITE_DIR=_site-pages IMAGE_BASEURL="$PAGES_BASE_PATH" node tests/image-delivery-browser.mjs
            ERROR_SITE_DIR=_site-pages ERROR_BASEURL="$PAGES_BASE_PATH" node tests/errors-browser.mjs
            URL_SITE_DIR=_site-pages URL_BASEURL="$PAGES_BASE_PATH" URL_ORIGIN="$PAGES_ORIGIN" node tests/article-urls-browser.mjs
            python3 scripts/check_pdf_colors.py _site-pages
          fi
      - name: Save validated PDF cache
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .pdf-cache
          key: ${{ steps.pdf-cache.outputs.cache-primary-key }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: vars.ARTICLE_PDF_RELEASE_STORAGE != 'true'
        with:
          path: _site-pages
      - name: Retain checked local output for the opt-in storage job
        if: vars.ARTICLE_PDF_RELEASE_STORAGE == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pdf-storage-input
          path: |
            _site-pages
            test-results/pdf-storage-plan.json
            test-results/pdf-compatibility-cache
            test-results/pdf-compatibility-fetch.json
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
  pdf-storage:
    needs: build
    if: >-
      github.repository == 'Fuzzy-Technologies/history_math' &&
      github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.ARTICLE_PDF_RELEASE_STORAGE == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pdf-storage-input
          path: publication-input
      - name: Verify immutable PDF storage before constructing a separate Pages output
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTICLE_PDF_RELEASE_STORAGE: ${{ vars.ARTICLE_PDF_RELEASE_STORAGE }}
        run: >-
          python3 scripts/external_pdfs.py store
          --site-dir publication-input/_site-pages
          --plan publication-input/test-results/pdf-storage-plan.json
          --compatibility-dir publication-input/test-results/pdf-compatibility-cache
          --destination _site-pages-external
          --report test-results/pdf-storage-receipt.json
      - name: Verify external output, native downloads and unchanged size budget
        run: |
          npm ci
          npx playwright install --with-deps chromium
          python3 scripts/check_site.py _site-pages-external "$(node -p 'JSON.parse(require("fs").readFileSync("_site-pages-external/assets/article-pdfs.json")).baseurl')" "$(node -p 'JSON.parse(require("fs").readFileSync("_site-pages-external/assets/article-pdfs.json")).origin')"
          PDF_SITE_DIR=_site-pages-external node tests/pdf-delivery-browser.mjs
          node scripts/publication-size.mjs _site-pages-external
      - name: Retain PDF verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pdf-storage-receipt
          path: |
            test-results/pdf-storage-receipt.json
            publication-input/test-results/pdf-storage-plan.json
            publication-input/test-results/pdf-compatibility-fetch.json
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site-pages-external
  deploy:
    if: >-
      always() && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.build.result == 'success' &&
      ((vars.ARTICLE_PDF_RELEASE_STORAGE == 'true' && needs.pdf-storage.result == 'success') ||
       (vars.ARTICLE_PDF_RELEASE_STORAGE != 'true' && needs.pdf-storage.result == 'skipped'))
    needs: [build, pdf-storage]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved master
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
