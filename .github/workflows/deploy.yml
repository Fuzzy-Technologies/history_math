name: Publish approved master

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      pages: read
      actions: read
    runs-on: ubuntu-24.04
    # Production PDF rendering and media transfers have their own job budget.
    timeout-minutes: 360
    environment: history-math-storage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages
      - name: Install publication dependencies
        run: npm ci
      - name: Validate article sources and reading assets
        timeout-minutes: 5
        run: |
          python3 tools/markdown_tables.py
          python3 tools/image_assets.py
          python3 tools/pdf_mastheads.py
          node scripts/check-articles.mjs --source-only
      - name: Restore media receipts from the current Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publication-state.mjs
      - name: Prepare bounded full-resolution JPEG originals
        run: |
          python3 -m pip install -r tools/requirements-images.txt
          python3 scripts/publication_jpegs.py --published-state test-results/publication-state/previous.json --registry site/_data/image_publication.json --output test-results/publication-jpegs/plan.json
      - name: Install PDF rendering engine
        run: npx playwright install --with-deps chromium
      - name: Build and verify configured Pages site
        env:
          JEKYLL_ENV: production
          # Pages can report HTTP while the custom-domain certificate is being issued.
          PAGES_ORIGIN: https://${{ steps.pages.outputs.host }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          node scripts/pages-config.mjs > "$RUNNER_TEMP/history-math-pages.yml"
          HISTORY_MATH_PUBLICATION_REF="$GITHUB_SHA" HISTORY_MATH_PUBLICATION_STRICT=1 bundle exec jekyll build --config "_config.yml,$RUNNER_TEMP/history-math-pages.yml" --destination _site-pages --trace
          node scripts/article-pdf.mjs --site-dir _site-pages --reuse-published
      - name: Publish verified S3 media
        env:
          PAGES_ORIGIN: https://${{ steps.pages.outputs.host }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ vars.S3_ENDPOINT_URL }}
          S3_REGION: ${{ vars.S3_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_PUBLIC_BASE_URL: ${{ vars.S3_PUBLIC_BASE_URL }}
        run: node scripts/publication-media.mjs --site-dir _site-pages --publish --prune-output
      - name: Optimize reading WebP previews for Pages
        run: python3 scripts/optimize_reading_webp.py _site-pages
      - name: Publish external reading previews
        if: vars.PREVIEW_DELIVERY_BASE_URL != ''
        env:
          PREVIEW_DELIVERY_BASE_URL: ${{ vars.PREVIEW_DELIVERY_BASE_URL }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ vars.S3_ENDPOINT_URL }}
          S3_REGION: ${{ vars.S3_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_PUBLIC_BASE_URL: ${{ vars.S3_PUBLIC_BASE_URL }}
        run: node scripts/publish-reading-previews.mjs _site-pages
      - name: Verify final lightweight publication
        timeout-minutes: 5
        env:
          PAGES_ORIGIN: https://${{ steps.pages.outputs.host }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          python3 scripts/check_site.py _site-pages "$PAGES_BASE_PATH" "$PAGES_ORIGIN"
          node scripts/publication-size.mjs _site-pages
      - name: Retain media integrity receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publication-media-${{ github.sha }}-${{ github.run_id }}
          path: _site-pages/assets/publication-media.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site-pages
  deploy:
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved master
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
