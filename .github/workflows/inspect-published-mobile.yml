name: Inspect published mobile articles
on:
  push:
    branches: [feature/mobile-formula-containment]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Inspect live published pages without a site build
        run: |
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser = await chromium.launch();
          const page = await browser.newPage({viewport: {width: 320, height: 1000}, reducedMotion: 'reduce'});
          const urls = [
            'https://history-math.org/ru/articles/hm-tt-d055acbd27c8-ru/',
            'https://history-math.org/articles/hm-tt-d055acbd27c8-en/'
          ];
          let checked = 0;
          for (const width of [320, 390, 1440]) for (const theme of ['light', 'dark']) for (const url of urls) {
            await page.setViewportSize({width, height: 1000});
            await page.emulateMedia({colorScheme: theme});
            await page.goto(url, {waitUntil: 'networkidle'});
            await page.evaluate(() => document.fonts.ready);
            const before = await page.evaluate(() => document.documentElement.scrollWidth);
            await page.addStyleTag({content: '.prose pre { max-width: 100%; overflow-x: auto; }'});
            const after = await page.evaluate(() => document.documentElement.scrollWidth);
            if (after > width + 1) throw Error('Overflow after containment: ' + url);
            await page.addScriptTag({path: 'node_modules/axe-core/axe.min.js'});
            const violations = await page.evaluate(async () => (await axe.run(document, {runOnly: {type: 'tag', values: ['wcag2a', 'wcag2aa', 'wcag21aa']}})).violations);
            if (violations.length) throw Error(JSON.stringify(violations.map(x=>({id:x.id,nodes:x.nodes.map(n=>n.target)}))));
            const unrendered = await page.locator('.math-source:not([data-rendered=true])').count();
            if (unrendered) throw Error('Unrendered formula');
            checked++;
            console.log('PASS ' + JSON.stringify({url,width,theme,before,after}));
          }
          console.log('SUMMARY ' + JSON.stringify({checked, failures: 0}));
          await browser.close();
          JS
