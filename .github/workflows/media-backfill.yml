name: Backfill existing publication media to S3

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  pages: read

# Share the publication lock: a backfill cannot race a production deployment.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  copy:
    if: github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: history-math-storage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages
      - run: npm ci
      - name: Copy and publicly verify existing media
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAGES_ORIGIN: https://${{ steps.pages.outputs.host }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ vars.S3_ENDPOINT_URL }}
          S3_REGION: ${{ vars.S3_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_PUBLIC_BASE_URL: ${{ vars.S3_PUBLIC_BASE_URL }}
        run: node scripts/backfill-media.mjs
      - name: Retain public integrity receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: media-backfill-${{ github.sha }}-${{ github.run_id }}
          path: test-results/media-backfill/receipt.json
          if-no-files-found: error
          retention-days: 90
