name: Inspect published home selections
on:
  push:
    branches: [feature/mobile-card-containment]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Inspect live published pages without a site build
        run: |
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser = await chromium.launch();
          const page = await browser.newPage({viewport: {width: 320, height: 1000}, reducedMotion: 'reduce'});
          await page.addInitScript(() => {
            let seed = Number(new URL(location.href).searchParams.get('qaSeed')) + 1;
            Math.random = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
          });
          for (let seed = 0; seed < 24; seed++) {
            await page.goto('https://history-math.org/ru/?qaSeed=' + seed, {waitUntil: 'networkidle'});
            await page.locator('img').evaluateAll(async images => { for (const image of images) image.loading = 'eager'; await Promise.all(images.map(image => image.decode())); });
            const report = await page.evaluate(() => ({
              width: innerWidth, actual: document.documentElement.scrollWidth,
              picks: [...document.querySelectorAll('#latest-cards h3, #archive-cards h3')].map(n=>n.textContent),
              wide: [...document.querySelectorAll('main *')].filter(n => n.getBoundingClientRect().right > innerWidth + 1)
                .map(n => ({tag: n.tagName, class: n.className?.baseVal ?? n.className,
                  width: n.getBoundingClientRect().width, right: n.getBoundingClientRect().right,
                  display: getComputedStyle(n).display, overflow: getComputedStyle(n).overflowX,
                  text: n.textContent.trim().slice(0, 200)})).slice(0, 25)
            }));
            console.log('SELECTION ' + JSON.stringify({seed,...report}));
            if (report.actual > report.width + 1) break;
          }
          await browser.close();
          JS
