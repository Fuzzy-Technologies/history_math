name: Inspect published home selections
on:
  push:
    branches: [feature/mobile-card-containment]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Inspect live published pages without a site build
        run: |
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import {readFileSync} from 'node:fs';
          const browser = await chromium.launch();
          const page = await browser.newPage({viewport: {width: 320, height: 1000}, reducedMotion: 'reduce'});
          await page.addInitScript(() => {
            let seed = Number(new URL(location.href).searchParams.get('qaSeed')) + 1;
            Math.random = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
          });
          await page.route('**/assets/style.css?*', route => route.fulfill({contentType: 'text/css', body: readFileSync('site/assets/style.css','utf8')}));
          let checked = 0;
          for (const width of [320,390,1440]) for (const theme of ['light','dark']) for (const language of ['ru','en']) {
            await page.setViewportSize({width,height:1000});
            await page.emulateMedia({colorScheme:theme});
            for (let seed=0;seed<8;seed++) {
              await page.goto('https://history-math.org/' + (language==='ru'?'ru/':'') + '?qaSeed='+seed,{waitUntil:'networkidle'});
              await page.locator('img').evaluateAll(async images => { for(const image of images) image.loading='eager'; await Promise.all(images.map(image=>image.decode())); });
              const report=await page.evaluate(()=>({viewport:innerWidth,page:document.documentElement.scrollWidth}));
              if(report.page>report.viewport+1) throw Error(JSON.stringify({width,theme,language,seed,...report}));
              const tags=await page.locator('.tag').evaluateAll(nodes=>nodes.map(n=>({text:n.textContent,width:n.getBoundingClientRect().width,parent:n.parentElement.getBoundingClientRect().width})));
              if(tags.some(t=>t.width>t.parent+1)) throw Error('Tag exceeds its parent: '+JSON.stringify(tags));
              checked++;
            }
            await page.addScriptTag({path:'node_modules/axe-core/axe.min.js'});
            const violations=await page.evaluate(async()=>(await axe.run(document,{runOnly:{type:'tag',values:['wcag2a','wcag2aa','wcag21aa']}})).violations);
            if(violations.length) throw Error(JSON.stringify(violations.map(x=>({id:x.id,nodes:x.nodes.map(n=>n.target)}))));
            console.log('PASS '+JSON.stringify({width,theme,language,selections:8}));
          }
          console.log('SUMMARY '+JSON.stringify({checked,failures:0}));
          await browser.close();
          JS
